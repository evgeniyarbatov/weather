<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-labelledby="title desc">
  <title>Weather report logo</title>
  <desc>Sun inside a rounded sky tile.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9F4FF" />
      <stop offset="1" stop-color="#CFE3FF" />
    </linearGradient>
    <clipPath id="round">
      <circle cx="128" cy="128" r="128" />
    </clipPath>
  </defs>
  <g clip-path="url(#round)">
    <circle cx="128" cy="128" r="128" fill="url(#sky)" />
    <g transform="translate(13 13) scale(0.9)">
      <g fill="none" stroke="#FDB813" stroke-width="8" stroke-linecap="round">
        <line x1="78" y1="40" x2="78" y2="18" />
        <line x1="78" y1="148" x2="78" y2="126" />
        <line x1="30" y1="88" x2="10" y2="88" />
        <line x1="146" y1="88" x2="126" y2="88" />
        <line x1="44" y1="54" x2="28" y2="38" />
        <line x1="112" y1="54" x2="128" y2="38" />
        <line x1="44" y1="122" x2="28" y2="138" />
        <line x1="112" y1="122" x2="128" y2="138" />
      </g>
      <circle cx="78" cy="88" r="28" fill="#FDB813" />

      <path
        d="M24 228L74 188 108 204 128 168 150 206 184 186 232 228Z"
        fill="#5FAE6E"
        stroke="#3E7D4B"
        stroke-width="4"
        stroke-linejoin="round"
      />
    </g>
  </g>
</svg>
